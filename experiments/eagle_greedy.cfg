[config]
target_model = Qwen/Qwen3.5-9B
draft_model = Qwen/Qwen3.5-0.8B

language_code = ber
draft_model_type = eagle
tree_choices = conservative
decoding_mode = greedy
output_dir = checkpoints/eagle_model
task = translation
data_source = tatoeba
learning_rate = 1e-4
max_steps = 2000
batch_size = 2
grad_accum_steps = 16
