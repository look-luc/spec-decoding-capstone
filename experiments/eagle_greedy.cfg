[config]
target_model = Qwen/Qwen3.5-9B
draft_model = Qwen/Qwen3.5-0.8B

language_code = npi
draft_model_type = eagle
tree_choices = [1,2]
decoding_mode = greedy
output_dir = checkpoints/eagle_npi
task = translation
data_source = tatoeba
learning_rate = 2e-5
max_steps = 2000
batch_size = 32
grad_accum_steps = 2
warmup_steps = 100
eval_every = 500
gamma = 1
num_layers = 4
log_every = 10
max_samples = 7500
track_iterations = True
max_seq_len = 128
repetition_penalty = 1.1
repetition_penalty_window = 16
