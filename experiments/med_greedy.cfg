[config]
draft_model = Qwen/Qwen3.5-0.8B
target_model = Qwen/Qwen3.5-0.8B
language_code = ber
num_heads = 3
draft_model_type = medusa
decoding_mode = greedy
task = translation
data_source = tatoeba
